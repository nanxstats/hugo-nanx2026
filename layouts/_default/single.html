{{ define "main" }}
{{ partial "header" . }}

<main class="content my-10 max-w-[69ch] mx-auto w-full px-4 sm:px-6">
    <header class="mb-14">
        <h1 class="text-3xl lg:text-4xl font-sans tracking-tight text-ink font-semibold">{{ .Title }}</h1>
        {{ if and (not .Date.IsZero) (not (eq .Type "page")) }}
        <div class="mt-4 text-zinc-500 font-sans text-sm tracking-wide tabular-nums">
            {{ .Date.Format "Jan 2, 2006" }}
        </div>
        {{ end }}
    </header>
    <article class="prose prose-zinc max-w-none{{ if .Params.catalog }} catalog-page{{ end }}">
        {{ partial "content" . }}
    </article>
</main>

{{ partial "footer" . }}
{{ end }}
