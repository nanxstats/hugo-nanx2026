{{ define "main" }}
{{ partial "header" . }}

<main class="content my-10 lg:my-20 max-w-[65ch] mx-auto w-full px-4 sm:px-6">
    <div class="prose prose-zinc max-w-none">
        {{ partial "content" . }}
    </div>

    <div class="mt-8 pt-8">
        <h1 class="text-3xl lg:text-4xl font-sans tracking-tight text-ink font-medium mb-8">{{ .Title }}</h1>
        <div class="flex flex-wrap gap-3">
            {{ range .Data.Terms.Alphabetical }}
            <a href="{{ .Page.Permalink }}"
                class="inline-flex items-center px-4 py-1.5 rounded-full bg-zinc-100 text-zinc-600 hover:bg-zinc-200 hover:text-ink transition-colors text-sm font-medium tracking-wide !no-underline">
                {{ .Page.Title }} <span class="ml-2 px-2 py-0.5 rounded-full bg-white text-zinc-500 text-xs">{{ .Count
                    }}</span>
            </a>
            {{ end }}
        </div>
    </div>
</main>

{{ partial "footer" . }}
{{ end }}
