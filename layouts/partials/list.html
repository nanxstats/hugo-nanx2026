        class="text-zinc-500 font-sans text-sm tracking-wide shrink-0 sm:w-24">

    <a href="{{ .Permalink }}"
        class="text-ink hover:text-accent leading-snug transition-colors outline-none decoration-transparent hover:decoration-accent decoration-1 underline-offset-4 {{ if .Site.Params.progressively }} progressively {{ end }}">
