<li class="group border-b border-zinc-200/70 py-5 first:pt-0 last:border-b-0">
    <a href="{{ .Permalink }}"
        class="block no-underline outline-hidden {{ if .Site.Params.progressively }} progressively {{ end }}">
    <time datetime='{{ .Date.Format "2006-01-02T15:04:05Z07:00" }}'
        class="mb-1.5 block font-sans font-[450] text-zinc-500 text-sm tracking-wide tabular-nums transition-colors group-hover:text-zinc-700">
        {{ .Date.Format "2006-01-02" }}
    </time>
    <span
        class="font-sans text-[1.0625rem] sm:text-lg font-[500] leading-snug tracking-tight text-ink [text-wrap:balance] transition-colors group-hover:text-accent">
        {{ .Title }}
    </span>
    </a>
</li>
