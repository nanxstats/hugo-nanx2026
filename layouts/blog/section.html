{{ define "main" }}
{{ partial "header" . }}

<main class="content my-10 max-w-[65ch] mx-auto w-full px-4 sm:px-6">
    <div class="prose prose-zinc">
        {{ partial "content" . }}
    </div>

    <div class="mt-8 pt-1">
        <ul class="list-none pl-0 space-y-8">
            {{ range .Data.Pages.GroupByDate "2006" "desc"}}
            <li class="font-sans text-xl font-medium text-ink tracking-tight mb-4">{{ .Key }}</li>
            <div class="space-y-6">
                {{ range sort .Pages "Date" "desc" }}
                {{ partial "list" . }}
                {{ end }}
            </div>
            {{ end }}
        </ul>
    </div>
</main>

{{ partial "footer" . }}
{{ end }}
