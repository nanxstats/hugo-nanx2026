{{ define "title" }}404 - {{ .Site.Title }}{{ end }}

{{ define "main" }}
<main class="min-h-screen flex flex-col items-center justify-center px-6 text-center">
    <h1 class="font-serif font-normal text-ink leading-none tracking-tight text-[6rem] sm:text-[9rem] lg:text-[11rem]">
        404
    </h1>
    <p class="mt-7 sm:mt-10 font-sans text-sm sm:text-base font-[450] tracking-wide text-zinc-500">
        Page not found
    </p>
    <a href="{{ .Site.BaseURL }}"
        class="mt-8 sm:mt-10 inline-flex items-center justify-center font-sans text-sm font-[500] tracking-wide text-ink border border-zinc-300 rounded-full px-6 py-2.5 transition-colors duration-200 hover:bg-ink hover:text-paper hover:border-ink focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-accent/40 focus-visible:ring-offset-2 focus-visible:ring-offset-paper">
        Take me home
    </a>
</main>
{{ end }}
